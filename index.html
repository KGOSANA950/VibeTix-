<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outlets | VibeTix</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="top-nav">
        <div class="logo"><a href="index.html">Vibe<span>Tix</span></a></div>
        <div class="search-container">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Search events, artists, venues...">
        </div>
        <div class="nav-links">
            <div class="nav-item"><a href="index.html">Home</a></div>
            <div class="nav-item"><a href="faq.html">FAQ</a></div>
            <div class="nav-item"><a href="outlets.html">Outlets</a></div>
        </div>
    </nav>

    <div class="container">
        <h1 class="page-title">Find a VibeTix Outlet</h1>
        <p class="page-subtitle">Find a VibeTix outlet near you to purchase tickets in person.</p>

        <!-- Search Box -->
        <div class="outlet-search-box">
            <input type="text" id="outletSearch" placeholder="Search by outlet name, address or city...">
            <select id="provinceSelect">
                <option value="all">All Provinces</option>
                <option value="Gauteng">Gauteng</option>
                <option value="KwaZulu-Natal">KwaZulu-Natal</option>
                <option value="Western Cape">Western Cape</option>
            </select>
            <button style="padding: 12px 24px; background: var(--nav-blue); color: white; border: none; border-radius: 6px; cursor: pointer;"><i class="fas fa-search"></i></button>
        </div>

        <!-- Layout Grid -->
        <div class="outlet-layout">
            <!-- Map Side -->
            <div class="map-container" style="padding: 0; overflow: hidden;">
                <!-- Real Google Maps Iframe -->
                <iframe 
                    width="100%" 
                    height="100%" 
                    frameborder="0" 
                    style="border:0; min-height: 600px;" 
                    src="https://www.google.com/maps/embed/v1/place?key=YOUR_GOOGLE_MAPS_API_KEY&q=South+Africa" 
                    allowfullscreen>
                </iframe>
            </div>

            <!-- List Side -->
            <div class="outlet-list" id="outletList">
                <!-- Outlets will be injected here via JS -->
            </div>
        </div>
    </div>

    <script>
        // --- OUTLET DATABASE ---
        const outlets = [
            { name: "14 TUCK SHOP", type: "Retail Store", address: "SHOP, KwaZulu-Natal", province: "KwaZulu-Natal", phone: "0" },
            { name: "1692268 KENSINGTON ELECTRICAL WH", type: "Retail Store", address: "WH, Gauteng", province: "Gauteng", phone: "0116148556" },
            { name: "2ND AVENUE SPAR Kiosk", type: "Supermarket", address: "2nd Avenue, Pretoria, Gauteng", province: "Gauteng", phone: "0123456789" },
            { name: "CAPE TOWN CBD TICKET HUB", type: "Retail Store", address: "Long Street, Cape Town, Western Cape", province: "Western Cape", phone: "0219876543" }
        ];

        // --- RENDER OUTLETS ---
        function renderOutlets(province = 'all', searchTerm = '') {
            const list = document.getElementById('outletList');
            list.innerHTML = '';

            const filtered = outlets.filter(outlet => {
                const matchesProvince = province === 'all' || outlet.province === province;
                const matchesSearch = outlet.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                      outlet.address.toLowerCase().includes(searchTerm.toLowerCase());
                return matchesProvince && matchesSearch;
            });

            if (filtered.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:#64748b; margin-top:20px;">No outlets found matching your search.</p>';
                return;
            }

            filtered.forEach(outlet => {
                // Create a real Google Maps link based on the address
                const mapsLink = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(outlet.name + ' ' + outlet.address)}`;

                const card = document.createElement('div');
                card.className = 'outlet-card';
                card.innerHTML = `
                    <h4>${outlet.name}</h4>
                    <span class="outlet-type">${outlet.type}</span>
                    <p><i class="fas fa-map-marker-alt"></i> ${outlet.address}</p>
                    <p><i class="fas fa-phone"></i> ${outlet.phone}</p>
                    <a href="${mapsLink}" target="_blank">View on Google Maps <i class="fas fa-external-link-alt"></i></a>
                `;
                list.appendChild(card);
            });
        }

        // --- FILTER FUNCTIONALITY ---
        const searchInput = document.getElementById('outletSearch');
        const provinceSelect = document.getElementById('provinceSelect');

        function filterOutlets() {
            renderOutlets(provinceSelect.value, searchInput.value);
        }

        searchInput.addEventListener('input', filterOutlets);
        provinceSelect.addEventListener('change', filterOutlets);

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            renderOutlets(); // Load all outlets initially
        });
    </script>
</body>
</html>
