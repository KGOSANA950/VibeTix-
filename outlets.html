<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outlets | VibeTix</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
    <!-- Leaflet CSS (FREE - No API Key Required) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        #map {
            width: 100%;
            height: 600px;
            border-radius: 12px;
            border: 1px solid var(--border);
            z-index: 1;
        }
        .outlet-card.active {
            border-color: var(--brand-color);
            box-shadow: 0 4px 15px rgba(225, 29, 72, 0.1);
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <div class="logo"><a href="index.html">Vibe<span>Tix</span></a></div>
        <div class="search-container">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Search events, artists, venues...">
        </div>
        <div class="nav-links">
            <div class="nav-item"><a href="index.html">Home</a></div>
            <div class="nav-item"><a href="faq.html">FAQ</a></div>
            <div class="nav-item"><a href="outlets.html">Outlets</a></div>
        </div>
    </nav>

    <div class="container">
        <h1 class="page-title">Find a VibeTix Outlet</h1>
        <p class="page-subtitle">Click a pin on the map or a store in the list to see details.</p>

        <div class="outlet-search-box">
            <input type="text" id="outletSearch" placeholder="Search by outlet name (e.g. Shoprite, Boxer, Spar)...">
            <select id="provinceSelect">
                <option value="all">All Provinces</option>
                <option value="Gauteng">Gauteng</option>
                <option value="KwaZulu-Natal">KwaZulu-Natal</option>
                <option value="Western Cape">Western Cape</option>
            </select>
            <button onclick="filterOutlets()" style="padding: 12px 24px; background: var(--nav-blue); color: white; border: none; border-radius: 6px; cursor: pointer;"><i class="fas fa-search"></i></button>
        </div>

        <div class="outlet-layout">
            <!-- Free Interactive Map Container -->
            <div id="map"></div>

            <!-- List Side -->
            <div class="outlet-list" id="outletList">
                <!-- Outlets will be injected here via JS -->
            </div>
        </div>
    </div>

    <!-- Leaflet JavaScript (FREE) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // --- EXPANDED OUTLET DATABASE ---
        // Added popular SA retail stores with realistic coordinates
        const outlets = [
            // Gauteng
            { name: "Shoprite Sandton City", type: "Supermarket", address: "Sandton City Mall, Johannesburg, Gauteng", province: "Gauteng", phone: "011 883 1234", lat: -26.1076, lng: 28.0567 },
            { name: "Pick n Pay Rosebank", type: "Supermarket", address: "The Zone, Rosebank, Johannesburg, Gauteng", province: "Gauteng", phone: "011 447 5678", lat: -26.1466, lng: 28.0417 },
            { name: "Boxer Menlyn Park", type: "Supermarket", address: "Menlyn Park Shopping Centre, Pretoria, Gauteng", province: "Gauteng", phone: "012 348 9012", lat: -25.7833, lng: 28.2767 },
            { name: "Game Menlyn", type: "Retail Store", address: "Menlyn Park, Pretoria, Gauteng", province: "Gauteng", phone: "012 348 3456", lat: -25.7845, lng: 28.2789 },
            { name: "Spar Parkview", type: "Supermarket", address: "Parkview, Johannesburg, Gauteng", province: "Gauteng", phone: "011 646 7890", lat: -26.1667, lng: 28.0333 },

            // KwaZulu-Natal
            { name: "Shoprite Durban CBD", type: "Supermarket", address: "West Street, Durban, KwaZulu-Natal", province: "KwaZulu-Natal", phone: "031 304 1234", lat: -29.8587, lng: 31.0218 },
            { name: "Pick n Pay Gateway", type: "Supermarket", address: "Gateway Theatre of Shopping, Umhlanga, KZN", province: "KwaZulu-Natal", phone: "031 566 2345", lat: -29.7252, lng: 31.0752 },
            { name: "Boxer Chatsworth", type: "Supermarket", address: "Chatsworth Centre, Durban, KZN", province: "KwaZulu-Natal", phone: "031 401 3456", lat: -29.9167, lng: 30.8833 },
            { name: "Game Pavillion", type: "Retail Store", address: "The Pavilion Shopping Centre, Westville, KZN", province: "KwaZulu-Natal", phone: "031 265 4567", lat: -29.8333, lng: 30.9333 },
            { name: "Spar Glenwood", type: "Supermarket", address: "Glenwood, Durban, KZN", province: "KwaZulu-Natal", phone: "031 205 5678", lat: -29.8667, lng: 30.9833 },

            // Western Cape
            { name: "Shoprite Cape Town CBD", type: "Supermarket", address: "Adderley Street, Cape Town, Western Cape", province: "Western Cape", phone: "021 421 1234", lat: -33.9249, lng: 18.4241 },
            { name: "Pick n Pay Waterfront", type: "Supermarket", address: "V&A Waterfront, Cape Town, Western Cape", province: "Western Cape", phone: "021 421 2345", lat: -33.9046, lng: 18.4197 },
            { name: "Boxer Mitchells Plain", type: "Supermarket", address: "Mitchells Plain, Cape Town, Western Cape", province: "Western Cape", phone: "021 391 3456", lat: -34.0333, lng: 18.6167 },
            { name: "Game Canal Walk", type: "Retail Store", address: "Canal Walk Shopping Centre, Century City, Cape Town", province: "Western Cape", phone: "021 529 4567", lat: -33.8833, lng: 18.5167 },
            { name: "Spar Sea Point", type: "Supermarket", address: "Sea Point, Cape Town, Western Cape", province: "Western Cape", phone: "021 434 5678", lat: -33.9167, lng: 18.3833 }
        ];

        let map;
        let markers = [];

        // --- INITIALIZE MAP ---
        function initMap() {
            map = L.map('map').setView([-30.5595, 22.9375], 5);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                maxZoom: 19
            }).addTo(map);

            outlets.forEach((outlet, index) => {
                const marker = L.marker([outlet.lat, outlet.lng]).addTo(map);
                marker.bindPopup(`
                    <div style="font-family: 'Inter', sans-serif; padding: 5px;">
                        <h3 style="margin: 0 0 5px 0; font-size: 14px;">${outlet.name}</h3>
                        <p style="margin: 0 0 5px 0; font-size: 12px; color: #64748b;">${outlet.address}</p>
                        <p style="margin: 0; font-size: 12px; color: #64748b;"><i class="fas fa-phone"></i> ${outlet.phone}</p>
                    </div>
                `);
                markers.push({ marker, index });
            });

            renderOutlets();
        }

        // --- RENDER OUTLETS LIST ---
        function renderOutlets(filteredOutlets = outlets) {
            const list = document.getElementById('outletList');
            list.innerHTML = '';

            if (filteredOutlets.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:#64748b; margin-top:20px;">No outlets found matching your search.</p>';
                return;
            }

            filteredOutlets.forEach((outlet, index) => {
                const mapsLink = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(outlet.name + ' ' + outlet.address)}`;
                const originalIndex = outlets.findIndex(o => o.name === outlet.name);

                const card = document.createElement('div');
                card.className = 'outlet-card';
                card.innerHTML = `
                    <h4>${outlet.name}</h4>
                    <span class="outlet-type">${outlet.type}</span>
                    <p><i class="fas fa-map-marker-alt"></i> ${outlet.address}</p>
                    <p><i class="fas fa-phone"></i> ${outlet.phone}</p>
                    <a href="${mapsLink}" target="_blank">View on Google Maps <i class="fas fa-external-link-alt"></i></a>
                `;

                card.addEventListener('click', () => {
                    const markerObj = markers.find(m => m.index === originalIndex);
                    if (markerObj) {
                        map.setView([outlet.lat, outlet.lng], 14);
                        markerObj.marker.openPopup();
                    }
                });

                list.appendChild(card);
            });
        }

        // --- FILTER FUNCTION ---
        function filterOutlets() {
            const searchTerm = document.getElementById('outletSearch').value.toLowerCase();
            const province = document.getElementById('provinceSelect').value;

            const filtered = outlets.filter(outlet => {
                const matchesSearch = outlet.name.toLowerCase().includes(searchTerm);
                const matchesProvince = province === 'all' || outlet.province === province;
                return matchesSearch && matchesProvince;
            });

            renderOutlets(filtered);
        }

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            initMap();
        });
    </script>
</body>
</html>
